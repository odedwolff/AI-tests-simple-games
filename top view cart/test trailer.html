
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Vehicle & Trailer Simulation - Wide Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Compact Single-Line Header Area */
        .header-strip {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 6px 0;
            background-color: #111;
            border-bottom: 1px solid #333;
        }

        .header-strip h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            color: #4fc3f7;
            display: inline;
        }

        .instructions {
            font-size: 0.85rem;
            color: #aaaaaa;
        }

        /* Maximized Edge-to-Edge Grid Layout */
        .game-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: calc(100vh - 35px); /* Take up remaining vertical space */
            background-color: #222;
        }

        /* Wider Game Canvas Panel */
        .canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
            padding: 0;
            margin: 0;
        }

        canvas {
            background-color: #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            display: block;
            width: 100%;
            height: 100%;
            max-width: 1150px;
            max-height: 760px;
        }

        /* Ultra Narrow Developer Panel */
        .dev-panel {
            width: 190px;
            background-color: #141414;
            padding: 12px;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .dev-panel h2 {
            margin: 0 0 2px 0;
            font-size: 0.85rem;
            color: #4fc3f7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 4px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .control-group label {
            font-size: 0.75rem;
            color: #bbb;
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            font-family: monospace;
            color: #00e676;
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #4fc3f7;
            cursor: pointer;
            margin: 2px 0;
        }

        .note {
            font-size: 0.68rem;
            color: #666;
            font-style: italic;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="header-strip">
        <h1>Vehicle & Trailer Sandbox</h1>
        <div class="instructions">
            Controls: <b>Up/Down Arrows</b> to drive, <b>Left/Right Arrows</b> to steer.
        </div>
    </div>

    <div class="game-container">
        
        <div class="canvas-container">
            <canvas id="gameCanvas" width="1150" height="760"></canvas>
        </div>

        <div class="dev-panel">
            <h2>Physics Tuning</h2>
            
            <div class="control-group">
                <label for="maxSpeedSlider">
                    Fwd Speed: <span id="maxSpeedVal">4.5</span>
                </label>
                <input type="range" id="maxSpeedSlider" min="1.0" max="10.0" step="0.1" value="4.5">
            </div>

            <div class="control-group">
                <label for="reverseSpeedSlider">
                    Rev Speed: <span id="reverseSpeedVal">-2.0</span>
                </label>
                <input type="range" id="reverseSpeedSlider" min="-5.0" max="-0.5" step="0.1" value="-2.0">
            </div>

            <div class="control-group">
                <label for="trailerLengthSlider">
                    Trailer Len: <span id="trailerLengthVal">65</span>px
                </label>
                <input type="range" id="trailerLengthSlider" min="30" max="150" step="5" value="65">
            </div>

            <div class="control-group">
                <label for="jointFrictionSlider">
                    Joint Fric: <span id="jointFrictionVal">0.00</span>
                </label>
                <input type="range" id="jointFrictionSlider" min="0.00" max="0.95" step="0.05" value="0.00">
            </div>

            <hr style="border: 0; border-top: 1px solid #222; margin: 2px 0;">
            <h2>Dimension Scales</h2>

            <div class="control-group">
                <label for="carScaleSlider">
                    Vehicle Scale: <span id="carScaleVal">1.0</span>x
                </label>
                <input type="range" id="carScaleSlider" min="0.4" max="2.5" step="0.1" value="1.0">
                <div class="note">Scales from rear hitch point.</div>
            </div>

            <div class="control-group">
                <label for="trailerScaleSlider">
                    Trailer Scale: <span id="trailerScaleVal">1.0</span>x
                </label>
                <input type="range" id="trailerScaleSlider" min="0.4" max="2.5" step="0.1" value="1.0">
                <div class="note">Scales from trailer axle center.</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamic Configuration State
        const devSettings = {
            maxSpeed: 4.5,
            maxBackwardsSpeed: -2.0,
            trailerLength: 65,
            jointFriction: 0.00,
            carScale: 1.0,
            trailerScale: 1.0
        };

        // DOM Element Mapping
        const maxSpeedSlider = document.getElementById('maxSpeedSlider');
        const maxSpeedVal = document.getElementById('maxSpeedVal');
        const reverseSlider = document.getElementById('reverseSpeedSlider');
        const reverseVal = document.getElementById('reverseSpeedVal');
        const trailerLengthSlider = document.getElementById('trailerLengthSlider');
        const trailerLengthVal = document.getElementById('trailerLengthVal');
        const frictionSlider = document.getElementById('jointFrictionSlider');
        const frictionVal = document.getElementById('jointFrictionVal');
        const carScaleSlider = document.getElementById('carScaleSlider');
        const carScaleVal = document.getElementById('carScaleVal');
        const trailerScaleSlider = document.getElementById('trailerScaleSlider');
        const trailerScaleVal = document.getElementById('trailerScaleVal');

        // Event Linkage Loops
        maxSpeedSlider.addEventListener('input', (e) => {
            devSettings.maxSpeed = parseFloat(e.target.value);
            maxSpeedVal.textContent = devSettings.maxSpeed.toFixed(1);
        });
        reverseSlider.addEventListener('input', (e) => {
            devSettings.maxBackwardsSpeed = parseFloat(e.target.value);
            reverseVal.textContent = devSettings.maxBackwardsSpeed.toFixed(1);
        });
        trailerLengthSlider.addEventListener('input', (e) => {
            devSettings.trailerLength = parseInt(e.target.value);
            trailerLengthVal.textContent = devSettings.trailerLength;
        });
        frictionSlider.addEventListener('input', (e) => {
            devSettings.jointFriction = parseFloat(e.target.value);
            frictionVal.textContent = devSettings.jointFriction.toFixed(2);
        });
        carScaleSlider.addEventListener('input', (e) => {
            devSettings.carScale = parseFloat(e.target.value);
            carScaleVal.textContent = devSettings.carScale.toFixed(1);
        });
        trailerScaleSlider.addEventListener('input', (e) => {
            devSettings.trailerScale = parseFloat(e.target.value);
            trailerScaleVal.textContent = devSettings.trailerScale.toFixed(1);
        });

        // Keyboard System Map
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', (e) => { if (e.key in keys) { keys[e.key] = true; e.preventDefault(); } });
        window.addEventListener('keyup', (e) => { if (e.key in keys) { keys[e.key] = false; e.preventDefault(); } });

        // Base Structural Profiles
        const car = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            heading: 0,          
            speed: 0,
            steerAngle: 0,       
            length: 70,                  
            width: 50,           
            wheelLength: 20,
            wheelWidth: 8,
            acceleration: 0.12,
            deceleration: 0.08,
            friction: 0.04,
            maxSteerAngle: 0.6,  
            steerSpeed: 0.05,
            steerReturnSpeed: 0.06
        };

        const trailer = {
            x: (canvas.width / 2) - 65, 
            y: canvas.height / 2,
            heading: 0,
            width: 54,           
            wheelLength: 22,
            wheelWidth: 9
        };

        function drawGrid() {
            ctx.strokeStyle = '#252525';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function updatePhysics() {
            const currentCarLength = car.length * devSettings.carScale;
            const currentTrailerLength = devSettings.trailerLength * devSettings.trailerScale;

            // 1. Acceleration Profiles
            if (keys.ArrowUp) {
                if (car.speed < devSettings.maxSpeed) car.speed += car.acceleration;
            } else if (keys.ArrowDown) {
                if (car.speed > devSettings.maxBackwardsSpeed) car.speed -= car.acceleration;
            } else {
                if (car.speed > 0) car.speed = Math.max(0, car.speed - car.friction);
                else if (car.speed < 0) car.speed = Math.min(0, car.speed + car.friction);
            }

            if (car.speed > devSettings.maxSpeed) car.speed = devSettings.maxSpeed;
            if (car.speed < devSettings.maxBackwardsSpeed) car.speed = devSettings.maxBackwardsSpeed;

            // 2. Steer Angle Normalizations
            if (keys.ArrowLeft) {
                car.steerAngle = Math.max(-car.maxSteerAngle, car.steerAngle - car.steerSpeed);
            } else if (keys.ArrowRight) {
                car.steerAngle = Math.min(car.maxSteerAngle, car.steerAngle + car.steerSpeed);
            } else {
                if (car.steerAngle > 0) car.steerAngle = Math.max(0, car.steerAngle - car.steerReturnSpeed);
                else if (car.steerAngle < 0) car.steerAngle = Math.min(0, car.steerAngle + car.steerReturnSpeed);
            }

            // 3. Translate Master Positions
            car.x += car.speed * Math.cos(car.heading);
            car.y += car.speed * Math.sin(car.heading);
            car.heading += (car.speed * Math.tan(car.steerAngle)) / currentCarLength;

            // 4. Kinematic Constraint Resolution Loop
            const hitchX = car.x;
            const hitchY = car.y;

            const dx = hitchX - trailer.x;
            const dy = hitchY - trailer.y;

            const targetHeading = Math.atan2(dy, dx);
            let angleDiff = targetHeading - trailer.heading;
            angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));

            const rigidityFactor = 1 - devSettings.jointFriction;
            trailer.heading += angleDiff * rigidityFactor;

            trailer.x = hitchX - currentTrailerLength * Math.cos(trailer.heading);
            trailer.y = hitchY - currentTrailerLength * Math.sin(trailer.heading);

            // 5. Screen Bound Wraps / Blocks
            const margin = currentCarLength;
            if (car.x < margin) { car.x = margin; car.speed = 0; }
            if (car.x > canvas.width - margin) { car.x = canvas.width - margin; car.speed = 0; }
            if (car.y < margin) { car.y = margin; car.speed = 0; }
            if (car.y > canvas.height - margin) { car.y = canvas.height - margin; car.speed = 0; }
        }

        function drawWheel(x, y, angle, width, length, color = '#00e676') {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.fillStyle = color; 
            ctx.fillRect(-length / 2, -width / 2, length, width);
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-length / 2, 0); ctx.lineTo(length / 2, 0); ctx.stroke();
            ctx.restore();
        }

        function drawCar() {
            ctx.save();
            ctx.translate(car.x, car.y); 
            ctx.rotate(car.heading);
            ctx.scale(devSettings.carScale, devSettings.carScale); 

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            // Central spine structure
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(car.length, 0); ctx.stroke();
            // Axles
            ctx.beginPath(); ctx.moveTo(0, -car.width / 2); ctx.lineTo(0, car.width / 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(car.length, -car.width / 2); ctx.lineTo(car.length, car.width / 2); ctx.stroke();

            // Link Nodes
            ctx.fillStyle = '#ff5252';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(car.length, 0, 4, 0, Math.PI * 2); ctx.fill();

            // Wheels Assemblies
            drawWheel(0, -car.width / 2, 0, car.wheelWidth, car.wheelLength);
            drawWheel(0, car.width / 2, 0, car.wheelWidth, car.wheelLength);
            drawWheel(car.length, -car.width / 2, car.steerAngle, car.wheelWidth, car.wheelLength);
            drawWheel(car.length, car.width / 2, car.steerAngle, car.wheelWidth, car.wheelLength);

            ctx.restore();
        }

        function drawTrailer() {
            ctx.save();
            ctx.translate(trailer.x, trailer.y); 
            ctx.rotate(trailer.heading);
            ctx.scale(devSettings.trailerScale, devSettings.trailerScale); 

            ctx.strokeStyle = '#4fc3f7'; 
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            // Hitch Drawbar Tongue
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(devSettings.trailerLength, 0); ctx.stroke();
            // Main Axle Bar
            ctx.beginPath(); ctx.moveTo(0, -trailer.width / 2); ctx.lineTo(0, trailer.width / 2); ctx.stroke();

            // Minimalist Cargo Platform Frame
            ctx.strokeStyle = 'rgba(79, 195, 247, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-15, -trailer.width / 2, 35, trailer.width);

            // Ground Track Wheel Configurations
            drawWheel(0, -trailer.width / 2, 0, trailer.wheelWidth, trailer.wheelLength, '#ffb74d');
            drawWheel(0, trailer.width / 2, 0, trailer.wheelWidth, trailer.wheelLength, '#ffb74d');

            ctx.restore();
        }

        function drawHUD() {
            ctx.fillStyle = '#666';
            ctx.font = '12px monospace';
            ctx.fillText(`Velocity : ${car.speed.toFixed(2)}`, 15, 25);
            
            let relativeAngle = (car.heading - trailer.heading) * (180 / Math.PI);
            relativeAngle = ((relativeAngle + 180) % 360 + 360) % 360 - 180;
            
            ctx.fillStyle = Math.abs(relativeAngle) > 50 ? '#ff5252' : '#666';
            ctx.fillText(`Hitch Deg : ${relativeAngle.toFixed(1)}°`, 15, 42);
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            updatePhysics();
            drawTrailer();
            drawCar();
            drawHUD();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
