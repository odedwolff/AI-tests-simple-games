<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Vehicle &amp; Trailer Physics Sandbox</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --panel-2: #1c2330;
      --border: #2b3544;
      --text: #e6edf3;
      --muted: #8b9bb0;
      --accent: #3d9cf0;
      --accent-2: #f0b429;
      --danger: #e85d4c;
      --ok: #3ecf8e;
      --sidebar: 300px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #app { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 1fr var(--sidebar); height: 100%; }
    header {
      grid-column: 1 / -1;
      display: flex; align-items: center; gap: 16px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    header h1 span { color: var(--text); }
    .top-hint { font-size: 12px; color: var(--muted); margin-left: auto; }
    kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; color: var(--text); }
    #stage-wrap { position: relative; background: #0a0d12; overflow: hidden; }
    canvas#main { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #hud {
      position: absolute; left: 12px; top: 12px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #c9d4e0; pointer-events: none;
      background: rgba(10,13,18,.55); padding: 8px 10px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.06);
    }
    aside {
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px 14px 24px;
    }
    aside h2 {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin: 16px 0 8px;
      border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    aside h2:first-child { margin-top: 0; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    button, label.file-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
      flex: 1 1 auto;
    }
    button:hover, label.file-btn:hover { border-color: var(--accent); }
    button.active { background: #1a3a5c; border-color: var(--accent); color: #fff; }
    button.ok { border-color: #2a6a4a; }
    button.danger { border-color: #6a2a2a; }
    .slider-row { margin-bottom: 10px; }
    .slider-row label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .slider-row label b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=file] { display: none; }
    .legend { font-size: 11px; color: var(--muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Vehicle &amp; Trailer <span>Physics Sandbox</span></h1>
      <div class="top-hint">
        Drive: <kbd>W</kbd>/<kbd>↑</kbd> forward · <kbd>S</kbd>/<kbd>↓</kbd> reverse · <kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> steer · <kbd>Space</kbd> brake · <kbd>R</kbd> reset
      </div>
    </header>
    <div id="stage-wrap">
      <canvas id="main"></canvas>
      <div id="hud"></div>
    </div>
    <aside id="dev-panel">
      <h2>Level Editor</h2>
      <div class="row">
        <button id="btn-edit">Drive / Edit Mode</button>
      </div>
      <div class="row">
        <button id="btn-undo">Undo Box</button>
        <button id="btn-clear" class="danger">Clear All</button>
      </div>
      <p class="legend">In Edit mode, click-drag on the canvas to place axis-aligned obstacle boxes.</p>

      <h2>Stage Development</h2>
      <div class="row">
        <button id="btn-save">Save Stage</button>
        <label class="file-btn">Load Stage<input type="file" id="file-load" accept="application/json,.json"></label>
      </div>

      <h2>Ground Paint</h2>
      <div class="row">
        <button id="btn-paint">Paint Toggle</button>
        <button id="btn-clear-paint">Clear Tracks</button>
      </div>

      <h2>Safety &amp; Physics</h2>
      <div class="row">
        <button id="btn-jack" class="active">Jackknife Guard</button>
      </div>
      <div class="slider-row">
        <label>Fwd Speed <b id="v-maxSpeed">1.50</b></label>
        <input type="range" id="s-maxSpeed" min="1" max="10" step="0.1" value="1.5">
      </div>
      <div class="slider-row">
        <label>Rev Speed <b id="v-maxBackwardsSpeed">-1.10</b></label>
        <input type="range" id="s-maxBackwardsSpeed" min="-5" max="-0.5" step="0.1" value="-1.1">
      </div>
      <div class="slider-row">
        <label>Steer Stiff <b id="v-steerStiffness">2.00</b></label>
        <input type="range" id="s-steerStiffness" min="0.5" max="4" step="0.05" value="2">
      </div>
      <div class="slider-row">
        <label>Trailer Len <b id="v-trailerLength">85</b></label>
        <input type="range" id="s-trailerLength" min="30" max="150" step="1" value="85">
      </div>
      <div class="slider-row">
        <label>Joint Fric <b id="v-jointFriction">0.50</b></label>
        <input type="range" id="s-jointFriction" min="0" max="0.95" step="0.01" value="0.50">
      </div>

      <h2>Dimension Scales</h2>
      <div class="slider-row">
        <label>Vehicle Scale <b id="v-carScale">0.80</b></label>
        <input type="range" id="s-carScale" min="0.4" max="2.5" step="0.05" value="0.8">
      </div>
      <div class="slider-row">
        <label>Trailer Scale <b id="v-trailerScale">0.70</b></label>
        <input type="range" id="s-trailerScale" min="0.4" max="2.5" step="0.05" value="0.7">
      </div>
    </aside>
  </div>

  <script>
(function () {
  "use strict";

  const devSettings = {
    maxSpeed: 1.5,
    maxBackwardsSpeed: -1.1,
    steerStiffness: 2.0,
    trailerLength: 85,
    jointFriction: 0.50,
    carScale: 0.8,
    trailerScale: 0.7,
    editMode: false,
    jackknifeLock: true,
    maxHitchAngleDeg: 65,
    isPainting: false
  };

  const keys = Object.create(null);
  const obstacles = [];
  let draftBox = null;

  const canvas = document.getElementById("main");
  const ctx = canvas.getContext("2d");
  const hudEl = document.getElementById("hud");

  const paintCanvas = document.createElement("canvas");
  const pctx = paintCanvas.getContext("2d");

  let W = 800, H = 600, dpr = 1;

  function resize() {
    const wrap = document.getElementById("stage-wrap");
    dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const old = document.createElement("canvas");
    old.width = paintCanvas.width;
    old.height = paintCanvas.height;
    old.getContext("2d").drawImage(paintCanvas, 0, 0);
    paintCanvas.width = canvas.width;
    paintCanvas.height = canvas.height;
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.drawImage(old, 0, 0, paintCanvas.width, paintCanvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  const CAR = { w: 36, h: 18, wheelbase: 26, hitchBehindAxle: 14 };
  const TRAILER = { w: 48, h: 20 };

  const vehicle = {
    x: 280, y: 280, heading: 0, steer: 0, speed: 0, trailerHeading: 0
  };

  function resetVehicle() {
    vehicle.x = W * 0.35;
    vehicle.y = H * 0.5;
    vehicle.heading = 0;
    vehicle.steer = 0;
    vehicle.speed = 0;
    vehicle.trailerHeading = 0;
  }

  function carDims() {
    const s = devSettings.carScale;
    return {
      w: CAR.w * s, h: CAR.h * s,
      wheelbase: CAR.wheelbase * s,
      hitchBehind: CAR.hitchBehindAxle * s
    };
  }
  function trailerDims() {
    const s = devSettings.trailerScale;
    return { w: TRAILER.w * s, h: TRAILER.h * s, length: devSettings.trailerLength };
  }

  function hitchPos() {
    const c = carDims();
    return {
      x: vehicle.x - Math.cos(vehicle.heading) * c.hitchBehind,
      y: vehicle.y - Math.sin(vehicle.heading) * c.hitchBehind
    };
  }
  function trailerAxle() {
    const t = trailerDims();
    const h = hitchPos();
    return {
      x: h.x - Math.cos(vehicle.trailerHeading) * t.length,
      y: h.y - Math.sin(vehicle.trailerHeading) * t.length
    };
  }
  function boomTip() {
    const t = trailerDims();
    const axle = trailerAxle();
    const extra = t.w * 0.42;
    return {
      x: axle.x - Math.cos(vehicle.trailerHeading) * extra,
      y: axle.y - Math.sin(vehicle.trailerHeading) * extra
    };
  }

  function wrapAngle(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function hitchAngle() {
    return wrapAngle(vehicle.trailerHeading - vehicle.heading);
  }

  const input = { throttle: 0, steer: 0, brake: 0 };

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "KeyR") resetVehicle();
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  function readInput() {
    if (devSettings.editMode) {
      input.throttle = 0; input.steer = 0; input.brake = 1;
      return;
    }
    const up = keys.KeyW || keys.ArrowUp;
    const down = keys.KeyS || keys.ArrowDown;
    const left = keys.KeyA || keys.ArrowLeft;
    const right = keys.KeyD || keys.ArrowRight;
    input.throttle = (up ? 1 : 0) + (down ? -1 : 0);
    input.steer = (left ? -1 : 0) + (right ? 1 : 0);
    input.brake = keys.Space ? 1 : 0;
  }

  function cornersOf(cx, cy, heading, w, h) {
    const hw = w / 2, hh = h / 2;
    const c = Math.cos(heading), s = Math.sin(heading);
    const pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    return pts.map(([lx, ly]) => ({ x: cx + lx * c - ly * s, y: cy + lx * s + ly * c }));
  }

  function satOverlap(a, b) {
    const axes = [];
    for (const poly of [a, b]) {
      for (let i = 0; i < poly.length; i++) {
        const p = poly[i], q = poly[(i + 1) % poly.length];
        const nx = -(q.y - p.y), ny = q.x - p.x;
        const len = Math.hypot(nx, ny) || 1;
        axes.push({ x: nx / len, y: ny / len });
      }
    }
    for (const axis of axes) {
      let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
      for (const p of a) {
        const d = p.x * axis.x + p.y * axis.y;
        if (d < minA) minA = d; if (d > maxA) maxA = d;
      }
      for (const p of b) {
        const d = p.x * axis.x + p.y * axis.y;
        if (d < minB) minB = d; if (d > maxB) maxB = d;
      }
      if (maxA < minB || maxB < minA) return false;
    }
    return true;
  }

  function rectPoly(box) {
    return [
      { x: box.x, y: box.y },
      { x: box.x + box.w, y: box.y },
      { x: box.x + box.w, y: box.y + box.h },
      { x: box.x, y: box.y + box.h }
    ];
  }

  function colliding(cx, cy, heading, w, h) {
    const poly = cornersOf(cx, cy, heading, w, h);
    for (const ob of obstacles) {
      if (satOverlap(poly, rectPoly(ob))) return true;
    }
    return false;
  }

  let lastPaint = null;

  function step(dt) {
    readInput();
    const c = carDims();
    const t = trailerDims();

    const maxSteer = 0.7;
    const targetSteer = input.steer * maxSteer;
    const k = 8 / Math.max(0.35, devSettings.steerStiffness);
    vehicle.steer += (targetSteer - vehicle.steer) * Math.min(1, k * dt);
    if (Math.abs(input.steer) < 0.01) {
      vehicle.steer *= Math.pow(0.15, dt * devSettings.steerStiffness);
    }

    const accel = 70;
    if (input.brake) {
      vehicle.speed *= Math.pow(0.08, dt);
      if (Math.abs(vehicle.speed) < 2) vehicle.speed = 0;
    } else if (input.throttle > 0) {
      vehicle.speed += accel * dt;
    } else if (input.throttle < 0) {
      vehicle.speed -= accel * dt;
    } else {
      vehicle.speed *= Math.pow(0.25, dt);
    }

    const maxF = 55 * devSettings.maxSpeed;
    const maxR = 55 * Math.abs(devSettings.maxBackwardsSpeed);
    if (vehicle.speed > maxF) vehicle.speed = maxF;
    if (vehicle.speed < -maxR) vehicle.speed = -maxR;

    const wb = Math.max(8, c.wheelbase);
    const yawRate = (vehicle.speed / wb) * Math.tan(vehicle.steer);

    const prevX = vehicle.x, prevY = vehicle.y, prevH = vehicle.heading, prevTH = vehicle.trailerHeading;

    vehicle.heading = wrapAngle(vehicle.heading + yawRate * dt);
    vehicle.x += Math.cos(vehicle.heading) * vehicle.speed * dt;
    vehicle.y += Math.sin(vehicle.heading) * vehicle.speed * dt;

    const hitchVelX = vehicle.speed * Math.cos(vehicle.heading) + yawRate * c.hitchBehind * Math.sin(vehicle.heading);
    const hitchVelY = vehicle.speed * Math.sin(vehicle.heading) - yawRate * c.hitchBehind * Math.cos(vehicle.heading);

    const th = vehicle.trailerHeading;
    let omega = (hitchVelX * Math.sin(th) - hitchVelY * Math.cos(th)) / Math.max(12, t.length);
    const rel = wrapAngle(vehicle.trailerHeading - vehicle.heading);
    omega -= rel * devSettings.jointFriction * 2.2;
    omega *= (1 - devSettings.jointFriction * 0.35);
    vehicle.trailerHeading = wrapAngle(vehicle.trailerHeading + omega * dt);

    if (devSettings.jackknifeLock) {
      const maxA = devSettings.maxHitchAngleDeg * Math.PI / 180;
      let ha = wrapAngle(vehicle.trailerHeading - vehicle.heading);
      if (ha > maxA) {
        vehicle.trailerHeading = wrapAngle(vehicle.heading + maxA);
        if (vehicle.speed < 0) vehicle.speed *= 0.85;
      } else if (ha < -maxA) {
        vehicle.trailerHeading = wrapAngle(vehicle.heading - maxA);
        if (vehicle.speed < 0) vehicle.speed *= 0.85;
      }
    }

    const carPolyHit = colliding(vehicle.x, vehicle.y, vehicle.heading, c.w, c.h);
    const axle = trailerAxle();
    const trailHit = colliding(axle.x, axle.y, vehicle.trailerHeading, t.w, t.h);
    if (carPolyHit || trailHit) {
      vehicle.x = prevX; vehicle.y = prevY;
      vehicle.heading = prevH; vehicle.trailerHeading = prevTH;
      vehicle.speed *= -0.25;
    }

    const m = 20;
    if (vehicle.x < m) vehicle.x = m;
    if (vehicle.y < m) vehicle.y = m;
    if (vehicle.x > W - m) vehicle.x = W - m;
    if (vehicle.y > H - m) vehicle.y = H - m;

    if (devSettings.isPainting && Math.abs(vehicle.speed) > 4) {
      const tip = boomTip();
      pctx.save();
      pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      pctx.strokeStyle = "rgba(240,180,40,0.55)";
      pctx.lineWidth = Math.max(3, 5 * devSettings.trailerScale);
      pctx.lineCap = "round";
      pctx.beginPath();
      if (lastPaint) { pctx.moveTo(lastPaint.x, lastPaint.y); pctx.lineTo(tip.x, tip.y); }
      else { pctx.moveTo(tip.x, tip.y); pctx.lineTo(tip.x + 0.1, tip.y); }
      pctx.stroke();
      pctx.restore();
      lastPaint = tip;
    } else {
      lastPaint = null;
    }
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    const step = 40;
    for (let x = 0; x <= W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.restore();
  }

  function drawRectBody(cx, cy, heading, w, h, fill, stroke) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(heading);
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-w / 2, -h / 2, w, h, 3);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawWheel(cx, cy, heading, steer, s) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(heading + steer);
    ctx.fillStyle = "#1a1f28";
    ctx.strokeStyle = "#6a7380";
    ctx.lineWidth = 1;
    const ww = 7 * s, wh = 3.2 * s;
    ctx.fillRect(-ww / 2, -wh / 2, ww, wh);
    ctx.strokeRect(-ww / 2, -wh / 2, ww, wh);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0a0d12";
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    ctx.drawImage(paintCanvas, 0, 0, W, H);

    for (const ob of obstacles) {
      ctx.fillStyle = "rgba(232,93,76,0.35)";
      ctx.strokeStyle = "rgba(232,93,76,0.9)";
      ctx.lineWidth = 1.5;
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      ctx.strokeRect(ob.x, ob.y, ob.w, ob.h);
    }
    if (draftBox) {
      ctx.fillStyle = "rgba(61,156,240,0.25)";
      ctx.strokeStyle = "rgba(61,156,240,0.95)";
      ctx.setLineDash([4, 3]);
      ctx.fillRect(draftBox.x, draftBox.y, draftBox.w, draftBox.h);
      ctx.strokeRect(draftBox.x, draftBox.y, draftBox.w, draftBox.h);
      ctx.setLineDash([]);
    }

    const c = carDims();
    const t = trailerDims();
    const hitch = hitchPos();
    const axle = trailerAxle();
    const tip = boomTip();

    ctx.beginPath();
    ctx.moveTo(hitch.x, hitch.y);
    ctx.lineTo(axle.x, axle.y);
    ctx.strokeStyle = "#8b9bb0";
    ctx.lineWidth = 2;
    ctx.stroke();

    drawRectBody(axle.x, axle.y, vehicle.trailerHeading, t.w, t.h, "#2a3344", "#9aa8bc");
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 3.5 * devSettings.trailerScale, 0, Math.PI * 2);
    ctx.fillStyle = devSettings.isPainting ? "#f0b429" : "#6a7380";
    ctx.fill();

    const cs = devSettings.carScale;
    const fx = vehicle.x + Math.cos(vehicle.heading) * (c.wheelbase / 2);
    const fy = vehicle.y + Math.sin(vehicle.heading) * (c.wheelbase / 2);
    const rx = vehicle.x - Math.cos(vehicle.heading) * (c.wheelbase / 2);
    const ry = vehicle.y - Math.sin(vehicle.heading) * (c.wheelbase / 2);
    const px = Math.sin(vehicle.heading), py = -Math.cos(vehicle.heading);
    const track = c.h * 0.38;
    drawWheel(fx + px * track, fy + py * track, vehicle.heading, vehicle.steer, cs);
    drawWheel(fx - px * track, fy - py * track, vehicle.heading, vehicle.steer, cs);
    drawWheel(rx + px * track, ry + py * track, vehicle.heading, 0, cs);
    drawWheel(rx - px * track, ry - py * track, vehicle.heading, 0, cs);

    drawRectBody(vehicle.x, vehicle.y, vehicle.heading, c.w, c.h, "#1e4a78", "#5eb0ff");
    ctx.save();
    ctx.translate(vehicle.x, vehicle.y);
    ctx.rotate(vehicle.heading);
    ctx.fillStyle = "rgba(180,220,255,0.25)";
    ctx.fillRect(c.w * 0.05, -c.h * 0.32, c.w * 0.28, c.h * 0.64);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(hitch.x, hitch.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#f0b429";
    ctx.fill();

    const ha = hitchAngle() * 180 / Math.PI;
    hudEl.innerHTML =
      `mode: ${devSettings.editMode ? "EDIT" : "DRIVE"}<br>` +
      `spd: ${vehicle.speed.toFixed(1)} px/s<br>` +
      `steer: ${(vehicle.steer * 180 / Math.PI).toFixed(1)}°<br>` +
      `hitch: ${ha.toFixed(1)}° / ${devSettings.maxHitchAngleDeg}°` +
      (devSettings.jackknifeLock ? "  LOCK" : "") +
      (devSettings.isPainting ? "<br>paint: ON" : "");
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  resetVehicle();

  function setToggle(btn, on) { btn.classList.toggle("active", !!on); }

  const btnEdit = document.getElementById("btn-edit");
  const btnJack = document.getElementById("btn-jack");
  const btnPaint = document.getElementById("btn-paint");

  btnEdit.addEventListener("click", () => {
    devSettings.editMode = !devSettings.editMode;
    setToggle(btnEdit, devSettings.editMode);
    canvas.style.cursor = devSettings.editMode ? "crosshair" : "default";
  });
  document.getElementById("btn-undo").addEventListener("click", () => { obstacles.pop(); });
  document.getElementById("btn-clear").addEventListener("click", () => { obstacles.length = 0; });

  document.getElementById("btn-save").addEventListener("click", () => {
    const data = JSON.stringify({ obstacles: obstacles.map(o => ({ x: o.x, y: o.y, w: o.w, h: o.h })) }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "stage_config.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  document.getElementById("file-load").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(reader.result);
        const arr = Array.isArray(json) ? json : json.obstacles;
        if (!Array.isArray(arr)) throw new Error("no obstacles array");
        obstacles.length = 0;
        for (const o of arr) {
          if (o && Number.isFinite(+o.x) && Number.isFinite(+o.y)) {
            obstacles.push({ x: +o.x, y: +o.y, w: +o.w || 40, h: +o.h || 40 });
          }
        }
      } catch (err) {
        alert("Could not parse stage JSON: " + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  btnPaint.addEventListener("click", () => {
    devSettings.isPainting = !devSettings.isPainting;
    setToggle(btnPaint, devSettings.isPainting);
  });
  document.getElementById("btn-clear-paint").addEventListener("click", () => {
    pctx.setTransform(1, 0, 0, 1, 0, 0);
    pctx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
    lastPaint = null;
  });
  btnJack.addEventListener("click", () => {
    devSettings.jackknifeLock = !devSettings.jackknifeLock;
    setToggle(btnJack, devSettings.jackknifeLock);
  });

  const sliders = [
    ["maxSpeed", (v) => v.toFixed(2)],
    ["maxBackwardsSpeed", (v) => v.toFixed(2)],
    ["steerStiffness", (v) => v.toFixed(2)],
    ["trailerLength", (v) => String(Math.round(v))],
    ["jointFriction", (v) => v.toFixed(2)],
    ["carScale", (v) => v.toFixed(2)],
    ["trailerScale", (v) => v.toFixed(2)]
  ];
  for (const [key, fmt] of sliders) {
    const el = document.getElementById("s-" + key);
    const lab = document.getElementById("v-" + key);
    el.addEventListener("input", () => {
      devSettings[key] = parseFloat(el.value);
      lab.textContent = fmt(devSettings[key]);
    });
  }

  function canvasPoint(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  canvas.addEventListener("mousedown", (ev) => {
    if (!devSettings.editMode || ev.button !== 0) return;
    const p = canvasPoint(ev);
    draftBox = { x: p.x, y: p.y, w: 0, h: 0, ox: p.x, oy: p.y };
  });
  window.addEventListener("mousemove", (ev) => {
    if (!draftBox) return;
    const p = canvasPoint(ev);
    draftBox.x = Math.min(draftBox.ox, p.x);
    draftBox.y = Math.min(draftBox.oy, p.y);
    draftBox.w = Math.abs(p.x - draftBox.ox);
    draftBox.h = Math.abs(p.y - draftBox.oy);
  });
  window.addEventListener("mouseup", () => {
    if (!draftBox) return;
    if (draftBox.w > 6 && draftBox.h > 6) {
      obstacles.push({ x: draftBox.x, y: draftBox.y, w: draftBox.w, h: draftBox.h });
    }
    draftBox = null;
  });
})();
  </script>
</body>
</html>
